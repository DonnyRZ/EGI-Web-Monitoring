server {
    listen 80;
    listen [::]:80;
    # Public production hostname: helloit.egiresources.com. The internal
    # hostname remains only as a compatibility alias.
    server_name helloit.egiresources.com internal.egiresources.com;

    # Compress application JS/CSS/JSON at the public edge. The frontend is
    # delivered through this reverse proxy, so without this the initial
    # Next.js runtime is sent essentially uncompressed.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/wasm
        image/svg+xml
        text/css
        text/plain;

    # Ticket attachments allow up to 10 MB in the API; keep a little headroom for multipart overhead.
    client_max_body_size 12m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    # Private MinIO object access for browser-downloadable ticket attachments.
    # The host port is loopback-only; this vhost is the only public entrypoint.
    location ^~ /egi-monitoring/ {
        proxy_pass http://127.0.0.1:31012;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    # Next static chunks are content-addressed and safe to cache for a year.
    # This makes subsequent route opens and reloads independent of the
    # application container response time.
    location ^~ /_next/static/ {
        proxy_pass http://127.0.0.1:31010;
        proxy_http_version 1.1;
        include proxy_params;
        proxy_buffering on;
        proxy_hide_header Cache-Control;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /logo-egi.png {
        proxy_pass http://127.0.0.1:31010;
        proxy_http_version 1.1;
        include proxy_params;
        proxy_buffering on;
        proxy_hide_header Cache-Control;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /api/auth/login {
        proxy_pass http://127.0.0.1:31011;
        include proxy_params;
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:31011;
        include proxy_params;
        add_header Cache-Control "no-store" always;
    }

    location = /app-version {
        proxy_pass http://127.0.0.1:31010;
        proxy_http_version 1.1;
        include proxy_params;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    location /docs/ {
        proxy_pass http://127.0.0.1:31011;
        include proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:31010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        include proxy_params;
        # Route HTML/RSC shell responses must revalidate after each deployment.
        # Hashed Next static assets remain cached independently above.
        proxy_hide_header Cache-Control;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        add_header Cache-Control "private, no-cache, must-revalidate" always;
    }
}
