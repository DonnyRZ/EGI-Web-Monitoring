name: egi-web-monitoring

x-logging: &egi-logging
  driver: local
  options:
    max-size: "50m"
    max-file: "10"

x-database-environment: &egi-database-environment
  DATABASE_URL: postgresql://${DB_USER:?Set DB_USER}:${DB_PASSWORD:?Set DB_PASSWORD}@${DB_HOST:-host.docker.internal}:${DB_PORT:-5432}/${DB_NAME:-egi_monitoring}?schema=public

x-redis-environment: &egi-redis-environment
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  REDIS_DB: ${REDIS_DB:-0}

services:
  redis:
    image: ${REDIS_IMAGE:?Set REDIS_IMAGE}
    restart: unless-stopped
    logging: *egi-logging
    command: >-
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then exec redis-server
      --requirepass "$$REDIS_PASSWORD"; else exec redis-server; fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - egi_vps_redis:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ -n "$$REDIS_PASSWORD" ]; then
          redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG;
          else redis-cli ping | grep -q PONG; fi
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  minio:
    image: ${MINIO_IMAGE:?Set MINIO_IMAGE}
    restart: unless-stopped
    logging: *egi-logging
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:31012:9000"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
    volumes:
      - egi_vps_minio:/data

  backend-migrate:
    profiles: ["ops"]
    image: ${MIGRATION_IMAGE:?Set MIGRATION_IMAGE}
    restart: "no"
    logging: *egi-logging
    working_dir: /app
    command:
      - sh
      - -c
      - >-
        install -d /tmp/egi-migration-tools;
        cp /app/deploy/migration-tools/package*.json /tmp/egi-migration-tools/;
        npm ci --prefix /tmp/egi-migration-tools --ignore-scripts --no-audit --no-fund;
        exec /tmp/egi-migration-tools/node_modules/.bin/prisma migrate deploy
        --schema /app/packages/database/prisma/schema.prisma
    environment:
      NODE_ENV: production
      <<: *egi-database-environment
    volumes:
      - ${DEPLOY_APP_DIR:?Set DEPLOY_APP_DIR}/packages/database:/app/packages/database:ro
      - ${DEPLOY_APP_DIR:?Set DEPLOY_APP_DIR}/deploy/migration-tools:/app/deploy/migration-tools:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  backend-seed:
    profiles: ["ops-seed"]
    image: ${IMAGE_REGISTRY:?Set IMAGE_REGISTRY}/backend:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: "no"
    logging: *egi-logging
    command:
      - sh
      - -c
      - >-
        test -n "$$SEED_ADMIN_PASSWORD" ||
        (echo "SEED_ADMIN_PASSWORD is required for an explicit seed run" >&2 && exit 64);
        /opt/egi-runtime/node_modules/.bin/tsx packages/database/prisma/seed.ts
    environment:
      NODE_ENV: production
      <<: *egi-database-environment
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_DEVELOPER_EMAIL: ${SEED_DEVELOPER_EMAIL:-}
      SEED_DEVELOPER_PASSWORD: ${SEED_DEVELOPER_PASSWORD:-}
      SEED_BOS_IT_EMAIL: ${SEED_BOS_IT_EMAIL:-}
      SEED_BOS_IT_PASSWORD: ${SEED_BOS_IT_PASSWORD:-}
      SEED_PIC_WEB_EMAIL: ${SEED_PIC_WEB_EMAIL:-}
      SEED_PIC_WEB_PASSWORD: ${SEED_PIC_WEB_PASSWORD:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  backend:
    image: ${IMAGE_REGISTRY:?Set IMAGE_REGISTRY}/backend:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    logging: *egi-logging
    command: ["node", "apps/backend/dist/main.js"]
    environment:
      NODE_ENV: production
      BACKEND_PORT: 3001
      API_PREFIX: api
      <<: [*egi-database-environment, *egi-redis-environment]
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-egi-monitoring}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_SIGNED_URL_EXPIRES_SEC: ${S3_SIGNED_URL_EXPIRES_SEC:-900}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
    ports:
      - "127.0.0.1:31011:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3001/api/health/ready')
          .then(r=>process.exit(r.status === 200 ? 0 : 1))
          .catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  frontend:
    image: ${IMAGE_REGISTRY:?Set IMAGE_REGISTRY}/frontend:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    logging: *egi-logging
    command: ["node", "node_modules/next/dist/bin/next", "start", "-p", "3010"]
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:31010:3010"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3010/login').then(r=>process.exit(r.status < 500 ? 0 : 1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  scheduler:
    image: ${IMAGE_REGISTRY:?Set IMAGE_REGISTRY}/scheduler:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    logging: *egi-logging
    command: ["node", "apps/scheduler/dist/main.js"]
    environment:
      NODE_ENV: production
      <<: [*egi-database-environment, *egi-redis-environment]
      SCHEDULER_TICK_SECONDS: ${SCHEDULER_TICK_SECONDS:-15}
      MONITORING_INTERVAL_MINUTES: ${MONITORING_INTERVAL_MINUTES:-5}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: ${IMAGE_REGISTRY:?Set IMAGE_REGISTRY}/worker:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    logging: *egi-logging
    command: ["node", "apps/worker/dist/main.js"]
    environment:
      NODE_ENV: production
      <<: [*egi-database-environment, *egi-redis-environment]
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-egi-monitoring}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_SIGNED_URL_EXPIRES_SEC: ${S3_SIGNED_URL_EXPIRES_SEC:-900}
      HTTP_TIMEOUT_MS: ${HTTP_TIMEOUT_MS:-15000}
      BROWSER_TIMEOUT_MS: ${BROWSER_TIMEOUT_MS:-45000}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
      LATE_JOB_SKIP_MS: ${LATE_JOB_SKIP_MS:-240000}
      RETENTION_CRON: ${RETENTION_CRON:-0 2 * * *}
      RETENTION_MONITORING_RESULTS_DAYS: ${RETENTION_MONITORING_RESULTS_DAYS:-90}
      RETENTION_SCREENSHOTS_DAYS: ${RETENTION_SCREENSHOTS_DAYS:-1}
      RETENTION_NOTIFICATIONS_DAYS: ${RETENTION_NOTIFICATIONS_DAYS:-90}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-egi.egiholding@gmail.com}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

volumes:
  egi_vps_redis:
  egi_vps_minio:
