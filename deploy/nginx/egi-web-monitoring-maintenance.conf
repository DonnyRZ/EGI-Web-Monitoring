# Include this snippet inside each public EGI application server block before
# the normal /api and / locations. Install the companion maintenance.html at
# the root path referenced below before enabling the flag.
if (-f /run/egi-web-monitoring/maintenance.flag) {
    return 503;
}

error_page 503 /egi-maintenance.html;

location = /egi-maintenance.html {
    root /var/www/egi-web-monitoring/deploy/nginx;
    internal;
}
