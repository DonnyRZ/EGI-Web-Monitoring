name: Deploy production

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Run one explicitly approved deployment operation"
        required: true
        type: choice
        options:
          - preflight
          - migrate
          - deploy
          - rollback
      image_tag:
        description: "Full 40-character commit SHA"
        required: true
        type: string
      backend_digest:
        description: "Backend image sha256 digest"
        required: true
        type: string
      frontend_digest:
        description: "Frontend image sha256 digest"
        required: true
        type: string
      scheduler_digest:
        description: "Scheduler image sha256 digest"
        required: true
        type: string
      worker_digest:
        description: "Worker image sha256 digest"
        required: true
        type: string
      backup_verified:
        description: "Set YES only after local + offsite backup verification"
        required: true
        default: "NO"
        type: choice
        options:
          - "NO"
          - "YES"
      backfill_verified:
        description: "Set YES only after approved backfill report/apply"
        required: true
        default: "NO"
        type: choice
        options:
          - "NO"
          - "YES"

permissions:
  contents: read

concurrency:
  group: egi-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ inputs.operation }} production
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
    env:
      OPERATION: ${{ inputs.operation }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      BACKEND_DIGEST: ${{ inputs.backend_digest }}
      FRONTEND_DIGEST: ${{ inputs.frontend_digest }}
      SCHEDULER_DIGEST: ${{ inputs.scheduler_digest }}
      WORKER_DIGEST: ${{ inputs.worker_digest }}
      BACKUP_VERIFIED: ${{ inputs.backup_verified }}
      BACKFILL_VERIFIED: ${{ inputs.backfill_verified }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_HOST_FINGERPRINT: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
    steps:
      - name: Validate release approval inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$OPERATION" =~ ^(preflight|migrate|deploy|rollback)$ ]]
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BACKEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$FRONTEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$SCHEDULER_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$WORKER_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          if [[ "$OPERATION" == "migrate" || "$OPERATION" == "deploy" ]]; then
            [[ "$BACKUP_VERIFIED" == "YES" ]] || { echo "Backup verification is required."; exit 1; }
          fi
          if [[ "$OPERATION" == "deploy" ]]; then
            [[ "$BACKFILL_VERIFIED" == "YES" ]] || { echo "Backfill verification is required."; exit 1; }
          fi
          [[ -n "$DEPLOY_HOST" && -n "$DEPLOY_PORT" && -n "$DEPLOY_USER" ]]
          [[ -n "$DEPLOY_HOST_FINGERPRINT" ]]

      - name: Load deployment SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Pin VPS host fingerprint
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_HOST_FINGERPRINT" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Run approved VPS operation
        shell: bash
        run: |
          set -euo pipefail
          ssh_args=(-o BatchMode=yes -o StrictHostKeyChecking=yes -p "$DEPLOY_PORT")
          target="$DEPLOY_USER@$DEPLOY_HOST"
          wrapper="/usr/local/sbin/egi-web-monitoring-deploy"
          if [[ "$OPERATION" == "preflight" ]]; then
            ssh "${ssh_args[@]}" "$target" sudo -n "$wrapper" preflight
          else
            ssh "${ssh_args[@]}" "$target" sudo -n "$wrapper" "$OPERATION" "$IMAGE_TAG" "$BACKEND_DIGEST" "$FRONTEND_DIGEST" "$SCHEDULER_DIGEST" "$WORKER_DIGEST"
          fi

      - name: Reload Nginx after application rollout
        if: inputs.operation == 'deploy' || inputs.operation == 'rollback'
        shell: bash
        run: |
          set -euo pipefail
          ssh_args=(-o BatchMode=yes -o StrictHostKeyChecking=yes -p "$DEPLOY_PORT")
          ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" sudo -n /usr/local/sbin/egi-web-monitoring-deploy reload-nginx
