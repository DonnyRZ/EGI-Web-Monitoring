name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: egi-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Validate, test, and build
    runs-on: ubuntu-24.04
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/egi_monitoring_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate --schema packages/database/prisma/schema.prisma

      - name: Build workspace dependencies for typecheck
        run: npm run build:workspace-dependencies

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Run database and backend tests
        run: |
          npm run test:seed -w @egi/database
          npm run test:health -w @egi/backend
          npm run test:auth -w @egi/backend
          npm run test:auth-cookie -w @egi/backend
          npm run test:resource-access -w @egi/backend
          npm run test:tickets -w @egi/backend
          npm run test:tasks -w @egi/backend
          npm run test:workload -w @egi/backend
          npm run test:dashboard -w @egi/backend
          npm run test:lifecycle -w @egi/backend
          npm run test:url-safety -w @egi/backend
          npm run test:runtime-config -w @egi/backend

      - name: Run scheduler and worker unit tests
        run: |
          npm run test -w @egi/scheduler
          npm run test -w @egi/worker

      - name: Build all workspaces
        run: npm run build

      - name: Validate VPS Compose contract
        run: |
          docker compose --env-file deploy/env.ci.example -f deploy/docker-compose.vps.yml config --quiet
          docker compose --profile ops --env-file deploy/env.ci.example -f deploy/docker-compose.vps.yml config --quiet

  containers:
    name: Build, scan, and attest ${{ matrix.service }}
    needs: checks
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            workspace: "@egi/backend"
            base: node
          - service: frontend
            workspace: "@egi/frontend"
            base: node
          - service: scheduler
            workspace: "@egi/scheduler"
            base: node
          - service: worker
            workspace: "@egi/worker"
            base: playwright
    env:
      # Repository variables remain the rotation point; these audited immutable
      # fallbacks prevent a missing variable from selecting a mutable tag.
      NODE_BASE_IMAGE: ${{ vars.NODE_BASE_IMAGE_DIGEST || 'node:20-bookworm-slim@sha256:2cf067cfed83d5ea958367df9f966191a942351a2df77d6f0193e162b5febfc0' }}
      PLAYWRIGHT_BASE_IMAGE: ${{ vars.PLAYWRIGHT_BASE_IMAGE_DIGEST || 'mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Require verified immutable base image refs
        run: |
          test -n "$NODE_BASE_IMAGE" || { echo "NODE_BASE_IMAGE_DIGEST repository variable is required"; exit 1; }
          test -n "$PLAYWRIGHT_BASE_IMAGE" || { echo "PLAYWRIGHT_BASE_IMAGE_DIGEST repository variable is required"; exit 1; }
          [[ "$NODE_BASE_IMAGE" =~ @sha256:[0-9a-f]{64}$ ]] || { echo "Node base image must include sha256 digest"; exit 1; }
          [[ "$PLAYWRIGHT_BASE_IMAGE" =~ @sha256:[0-9a-f]{64}$ ]] || { echo "Playwright base image must include sha256 digest"; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set local image prefix
        id: image
        shell: bash
        run: echo "prefix=egi-web-monitoring" >> "$GITHUB_OUTPUT"

      - name: Build immutable service image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.service
          build-args: |
            BASE_IMAGE=${{ matrix.base == 'node' && env.NODE_BASE_IMAGE || env.PLAYWRIGHT_BASE_IMAGE }}
            SERVICE=${{ matrix.workspace }}
            NEXT_PUBLIC_API_URL=/api
          tags: ${{ steps.image.outputs.prefix }}/${{ matrix.service }}:${{ github.sha }}
          push: false
          load: true
          # Trivy and the SBOM step consume a locally loaded single-platform
          # image. BuildKit's provenance/SBOM attestations turn that output
          # into a manifest list, which the Docker exporter cannot load.
          # SBOM generation remains explicit in the following step.
          provenance: false
          sbom: false

      - name: Scan image for high and critical vulnerabilities
        # v0.36.0; pin the immutable upstream release commit.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ steps.image.outputs.prefix }}/${{ matrix.service }}:${{ github.sha }}
          format: json
          output: trivy-${{ matrix.service }}.json
          exit-code: "0"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Enforce vulnerability threshold
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report="trivy-${{ matrix.service }}.json"
          if [[ ! -s "$report" ]]; then
            echo "::error file=$report::Trivy did not produce a scan report."
            exit 1
          fi
          count="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL")] | length' "$report")"
          if (( count > 0 )); then
            summary="$(jq -r '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL") | "\(.Severity) \(.VulnerabilityID) \(.PkgName) \(.InstalledVersion) -> \(.FixedVersion // "no-fixed-version")"] | .[:12] | join("; ")' "$report")"
            echo "::error file=$report::Found $count HIGH/CRITICAL vulnerabilities: $summary"
            exit 1
          fi
          echo "No HIGH/CRITICAL vulnerabilities found."

      - name: Upload vulnerability scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-scan-${{ matrix.service }}-${{ github.sha }}
          path: trivy-${{ matrix.service }}.json
          if-no-files-found: warn
          retention-days: 30

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0.17.0
        with:
          image: ${{ steps.image.outputs.prefix }}/${{ matrix.service }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom-${{ matrix.service }}.spdx.json

      - name: Record image digest
        shell: bash
        run: |
          mkdir -p deployment-artifacts
          printf '%s@%s\n' \
            "${{ steps.image.outputs.prefix }}/${{ matrix.service }}:${{ github.sha }}" \
            "${{ steps.build.outputs.digest }}" \
            > "deployment-artifacts/${{ matrix.service }}.txt"

      - name: Upload SBOM and deployment metadata
        uses: actions/upload-artifact@v4
        with:
          name: deployment-${{ matrix.service }}-${{ github.sha }}
          path: |
            sbom-${{ matrix.service }}.spdx.json
            deployment-artifacts/${{ matrix.service }}.txt
          if-no-files-found: error
          retention-days: 30
